<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <!-- Polished Stainless Steel / Dark Slate Body -->
    <linearGradient id="espressoChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#334155"/>
      <stop offset="25%" stopColor="#475569"/>
      <stop offset="60%" stopColor="#64748b"/>
      <stop offset="85%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#1e293b"/>
    </linearGradient>
    <!-- Chrome Trim Gradient -->
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#94a3b8"/>
      <stop offset="50%" stopColor="#f8fafc"/>
      <stop offset="100%" stopColor="#64748b"/>
    </linearGradient>
    <!-- Vintage Gold Gauge Bezel -->
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="50%" stopColor="#ca8a04"/>
      <stop offset="100%" stopColor="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="120" cy="265" rx="68" ry="8" fill="rgba(0,0,0,0.25)"/>

  <!-- ─── WATER TANK (Rear Translucent Cylinder) ─── -->
  <rect x="80" y="32" width="80" height="80" rx="10" fill="rgba(186, 230, 253, 0.35)" stroke="#7dd3fc" stroke-width="1"/>
  <!-- Water Level Line -->
  <path d="M 82 56 Q 120 59 158 56" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none"/>

  <!-- ─── MAIN MACHINE CHASSIS ─── -->
  <!-- Top Cup Warmer Tray -->
  <rect x="68" y="24" width="104" height="14" rx="4" fill="url(#chromeTrim)" stroke="#475569" stroke-width="1"/>
  <rect x="74" y="26" width="92" height="4" rx="2" fill="#334155"/>

  <!-- Main Slim Vertical Body -->
  <rect x="70" y="36" width="100" height="188" rx="8" fill="url(#espressoChassis)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Front Control Panel Inset -->
  <rect x="78" y="44" width="84" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Top 3 Button Cluster (Single Shot, Double Shot, Steam) -->
  <circle cx="94" cy="56" r="5.5" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="94" cy="56" r="2.5" fill="#38bdf8"/>

  <circle cx="120" cy="56" r="5.5" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="120" cy="56" r="2.5" fill="#38bdf8"/>

  <circle cx="146" cy="56" r="5.5" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="146" cy="56" r="2.5" fill="#f59e0b"/>

  <!-- Vintage Analog 15-Bar Pressure Gauge -->
  <circle cx="120" cy="85" r="18" fill="url(#goldBezel)" stroke="#713f12" stroke-width="1"/>
  <circle cx="120" cy="85" r="15" fill="#0f172a"/>
  <!-- Gauge Dial Face -->
  <circle cx="120" cy="85" r="13" fill="#f8fafc"/>
  <!-- Green Extraction Zone Arc -->
  <path d="M 112 79 A 10 10 0 0 1 128 79" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <!-- Dial Tick Marks -->
  <line x1="110" y1="88" x2="113" y2="86" stroke="#475569" stroke-width="0.8"/>
  <line x1="120" y1="73" x2="120" y2="76" stroke="#475569" stroke-width="0.8"/>
  <line x1="130" y1="88" x2="127" y2="86" stroke="#475569" stroke-width="0.8"/>
  <!-- Indicator Needle (Pointing right in sweet spot) -->
  <line x1="120" y1="85" x2="127" y2="77" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="120" cy="85" r="2" fill="#0f172a"/>

  <!-- ─── GROUP HEAD & PORTAFILTER ─── -->
  <!-- Group Head Collar -->
  <rect x="88" y="112" width="64" height="14" rx="4" fill="url(#chromeTrim)" stroke="#334155" stroke-width="1"/>

  <!-- Portafilter Filter Basket (Heavy Metal) -->
  <rect x="94" y="126" width="52" height="18" rx="4" fill="url(#chromeTrim)" stroke="#475569" stroke-width="1"/>
  <!-- Twin Pouring Spouts -->
  <polygon points="106,144 114,144 111,152 109,152" fill="#64748b"/>
  <polygon points="126,144 134,144 131,152 129,152" fill="#64748b"/>

  <!-- Ergonomic Portafilter Handle (Pointing Left/Front) -->
  <path d="M 94 133 L 42 138 Q 36 139 36 145 Q 36 151 42 150 L 94 139 Z" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <circle cx="40" cy="144.5" r="3" fill="#64748b"/>

  <!-- ─── STEAM WAND (Right Side) ─── -->
  <!-- Steam Valve Dial on Top Right -->
  <rect x="168" y="52" width="12" height="24" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Stainless Steam Wand Arm -->
  <path d="M 166 80 L 184 100 L 178 160" stroke="url(#chromeTrim)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Black Rubber Heat Protection Grip -->
  <path d="M 183 98 L 180 120" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Steam Nozzle Tip -->
  <circle cx="178" cy="162" r="3" fill="#475569"/>

  <!-- ─── DRIP TRAY & BASE ─── -->
  <!-- Drip Tray Well -->
  <rect x="64" y="218" width="112" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>

  <!-- Polished Stainless Steel Drip Grill -->
  <rect x="68" y="220" width="104" height="12" rx="3" fill="url(#chromeTrim)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Grill Drainage Slots -->
  <g fill="#0f172a">
    <rect x="76" y="223" width="8" height="6" rx="1.5"/>
    <rect x="88" y="223" width="8" height="6" rx="1.5"/>
    <rect x="100" y="223" width="8" height="6" rx="1.5"/>
    <rect x="112" y="223" width="8" height="6" rx="1.5"/>
    <rect x="124" y="223" width="8" height="6" rx="1.5"/>
    <rect x="136" y="223" width="8" height="6" rx="1.5"/>
    <rect x="148" y="223" width="8" height="6" rx="1.5"/>
    <rect x="160" y="223" width="8" height="6" rx="1.5"/>
  </g>

  <!-- Red Drip Tray Float Indicator Dot -->
  <circle cx="120" cy="226" r="2" fill="#ef4444"/>

  <!-- Rubber Non-Slip Base Feet -->
  <rect x="72" y="258" width="16" height="4" rx="2" fill="#0f172a"/>
  <rect x="152" y="258" width="16" height="4" rx="2" fill="#0f172a"/>
</svg>
