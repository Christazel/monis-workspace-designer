<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <linearGradient id="markusFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="markusSeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="60%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="markusGasLift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#64748b"/>
      <stop offset="50%" stopColor="#cbd5e1"/>
      <stop offset="100%" stopColor="#475569"/>
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="120" cy="265" rx="70" ry="9" fill="rgba(0,0,0,0.22)"/>

  <!-- 5-Star Caster Wheels -->
  <circle cx="58" cy="255" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="182" cy="255" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="84" cy="263" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="156" cy="263" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="266" r="5.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- 5-Star Base Legs -->
  <path d="M 120 238 L 60 254" stroke="url(#markusFrame)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 120 238 L 180 254" stroke="url(#markusFrame)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 120 238 L 86 261" stroke="url(#markusFrame)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 238 L 154 261" stroke="url(#markusFrame)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 238 L 120 264" stroke="url(#markusFrame)" stroke-width="8" stroke-linecap="round"/>

  <!-- Base Center Hub -->
  <circle cx="120" cy="238" r="9" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

  <!-- Gas Lift Cylinder -->
  <rect x="114" y="206" width="12" height="32" rx="3" fill="url(#markusGasLift)" stroke="#334155" stroke-width="0.8"/>

  <!-- Under-seat mechanism -->
  <rect x="100" y="194" width="40" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Armrest Uprights -->
  <path d="M 72 180 L 68 138" stroke="url(#markusFrame)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 168 180 L 172 138" stroke="url(#markusFrame)" stroke-width="6" stroke-linecap="round"/>

  <!-- Armrest Pads -->
  <rect x="54" y="132" width="28" height="8" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <rect x="158" y="132" width="28" height="8" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>

  <!-- Headrest (Integrated at Top) -->
  <rect x="94" y="24" width="52" height="24" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <rect x="98" y="28" width="44" height="16" rx="6" fill="#0f172a"/>
  <!-- Headrest cushion seams -->
  <line x1="120" y1="28" x2="120" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- High-Back Mesh Spine & Frame -->
  <path d="M 88 48 L 84 154 Q 120 162 156 154 L 152 48 Z" fill="#0f172a" stroke="url(#markusFrame)" stroke-width="2.5"/>

  <!-- High-Back Mesh Screen -->
  <path d="M 91 52 L 87 150 Q 120 157 153 150 L 149 52 Z" fill="#111827"/>

  <!-- Mesh Grid Patterns -->
  <g opacity="0.3" stroke="#475569" stroke-width="0.8">
    <line x1="89" y1="62" x2="151" y2="62"/>
    <line x1="88" y1="74" x2="152" y2="74"/>
    <line x1="87" y1="86" x2="153" y2="86"/>
    <line x1="86" y1="98" x2="154" y2="98"/>
    <line x1="86" y1="110" x2="154" y2="110"/>
    <line x1="85" y1="122" x2="155" y2="122"/>
    <line x1="85" y1="134" x2="155" y2="134"/>
    <line x1="86" y1="146" x2="154" y2="146"/>

    <line x1="100" y1="52" x2="97" y2="151"/>
    <line x1="110" y1="52" x2="108" y2="153"/>
    <line x1="120" y1="52" x2="120" y2="154"/>
    <line x1="130" y1="52" x2="132" y2="153"/>
    <line x1="140" y1="52" x2="143" y2="151"/>
  </g>

  <!-- Adjustable Lumbar Support Cushion / Bracket -->
  <rect x="94" y="118" width="52" height="14" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="100" y="122" width="40" height="6" rx="3" fill="#334155"/>

  <!-- Thick Padded Foam Seat Pan -->
  <rect x="74" y="170" width="92" height="24" rx="8" fill="url(#markusSeat)" stroke="#334155" stroke-width="1.5"/>
  <rect x="78" y="172" width="84" height="14" rx="6" fill="#1e293b" opacity="0.6"/>
  <!-- Front waterfall curve -->
  <path d="M 76 186 Q 120 196 164 186" stroke="#475569" stroke-width="1" fill="none"/>
</svg>
