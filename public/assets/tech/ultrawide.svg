<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" fill="none">
  <defs>
    <!-- Screen Wallpaper Gradient -->
    <linearGradient id="uwScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a"/>
      <stop offset="30%" stopColor="#0284c7"/>
      <stop offset="65%" stopColor="#0d9488"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>
    <!-- Stand Chrome/Metallic Gradient -->
    <linearGradient id="uwStandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="uwBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#cbd5e1"/>
      <stop offset="50%" stopColor="#f1f5f9"/>
      <stop offset="100%" stopColor="#cbd5e1"/>
    </linearGradient>
    <!-- Glass sheen -->
    <linearGradient id="uwGlassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255,255,255,0.14)"/>
      <stop offset="40%" stopColor="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="170" cy="210" rx="90" ry="7" fill="rgba(0,0,0,0.2)"/>

  <!-- Monitor Stand Base (Curved Arc matching 4K-27) -->
  <path d="M 80 205 C 130 216, 210 216, 260 205 C 240 197, 100 197, 80 205 Z" fill="url(#uwBaseGrad)" stroke="#94a3b8" stroke-width="0.8"/>
  <ellipse cx="170" cy="204" rx="14" ry="4" fill="#64748b" opacity="0.5"/>

  <!-- Stand Vertical Column -->
  <rect x="159" y="125" width="22" height="78" rx="4" fill="url(#uwStandGrad)" stroke="#1e293b" stroke-width="1"/>
  <!-- Cable pass-through hole -->
  <rect x="165" y="160" width="10" height="24" rx="5" fill="#090d16" stroke="#475569" stroke-width="0.8"/>

  <!-- Outer Bezel (Curved Ultrawide) -->
  <rect x="10" y="16" width="320" height="126" rx="8" fill="#111827" stroke="#1e293b" stroke-width="2"/>

  <!-- Inner Screen Frame -->
  <rect x="15" y="21" width="310" height="116" rx="5" fill="#0a0e17"/>

  <!-- Display Area with Vibrant Gradient Wallpaper -->
  <rect x="17" y="23" width="306" height="112" rx="4" fill="url(#uwScreenGrad)"/>

  <!-- Diagonal Glass Sheen -->
  <polygon points="17,23 180,23 90,135 17,135" fill="url(#uwGlassSheen)"/>

  <!-- UI Windows / Code Mockup -->
  <!-- Left Window (Code editor) -->
  <rect x="25" y="32" width="120" height="92" rx="4" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <circle cx="33" cy="40" r="2.5" fill="#ef4444"/>
  <circle cx="40" cy="40" r="2.5" fill="#f59e0b"/>
  <circle cx="47" cy="40" r="2.5" fill="#10b981"/>
  <rect x="33" y="48" width="55" height="4" rx="2" fill="rgba(56,189,248,0.7)"/>
  <rect x="33" y="56" width="80" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="33" y="63" width="70" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="43" y="70" width="60" height="3" rx="1.5" fill="rgba(168,85,247,0.7)"/>
  <rect x="43" y="77" width="50" height="3" rx="1.5" fill="rgba(34,197,94,0.7)"/>
  <rect x="33" y="84" width="75" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Right Window (Design preview) -->
  <rect x="155" y="32" width="158" height="92" rx="4" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <rect x="165" y="42" width="138" height="50" rx="3" fill="rgba(2,132,199,0.25)"/>
  <circle cx="234" cy="67" r="16" fill="rgba(217,119,6,0.3)"/>
  <rect x="165" y="100" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="165" y="109" width="120" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Power Status LED at bottom bezel -->
  <circle cx="170" cy="138" r="1.5" fill="#38bdf8" filter="drop-shadow(0 0 3px #38bdf8)"/>
</svg>
