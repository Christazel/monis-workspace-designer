<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#FFF1F1"/>
  <!-- Clean product illustration area -->
  <rect x="100" y="100" width="600" height="500" rx="16" fill="white" opacity="0.7"/>
  <!-- Large emoji / icon area -->
  <text x="400" y="380" font-size="180" text-anchor="middle" dominant-baseline="middle" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🪑</text>
  <!-- Product label -->
  <rect x="160" y="580" width="480" height="64" rx="8" fill="#ef4444" opacity="0.12"/>
  <text x="400" y="619" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle" 
    font-family="Inter, system-ui, sans-serif" fill="#ef4444">Gaming Racer Chair</text>
  <!-- Corner dot branding -->
  <circle cx="726" cy="74" r="20" fill="#ef4444" opacity="0.35"/>
</svg>