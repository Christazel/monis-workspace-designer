<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <!-- Anodized Sandblasted Aluminum Gradient -->
    <linearGradient id="mstandMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1f5f9"/>
      <stop offset="35%" stopColor="#cbd5e1"/>
      <stop offset="70%" stopColor="#94a3b8"/>
      <stop offset="100%" stopColor="#64748b"/>
    </linearGradient>
    <linearGradient id="mstandInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#64748b"/>
      <stop offset="50%" stopColor="#94a3b8"/>
      <stop offset="100%" stopColor="#475569"/>
    </linearGradient>
    <linearGradient id="mstandBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#cbd5e1"/>
      <stop offset="50%" stopColor="#f8fafc"/>
      <stop offset="100%" stopColor="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="160" cy="202" rx="110" ry="10" fill="rgba(0,0,0,0.2)"/>

  <!-- ─── SOLID ALUMINUM BASE PLATFORM ─── -->
  <!-- Base Plate -->
  <polygon points="54,196 266,196 250,172 70,172" fill="url(#mstandBase)" stroke="#94a3b8" stroke-width="1"/>
  <!-- Base Front Beveled Lip -->
  <rect x="54" y="194" width="212" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

  <!-- Non-Slip Rubber Base Footpads -->
  <rect x="76" y="198" width="24" height="2" rx="1" fill="#334155"/>
  <rect x="220" y="198" width="24" height="2" rx="1" fill="#334155"/>

  <!-- ─── FLOWING REAR RISER COLUMN (Single Piece Curved Aluminum) ─── -->
  <!-- Back Upright Section -->
  <path d="M 100 172 C 100 130, 108 90, 108 76 L 212 76 C 212 90, 220 130, 220 172 Z" fill="url(#mstandInner)" stroke="#475569" stroke-width="1"/>

  <!-- Iconic Circular Cable Management Pass-Through Hole -->
  <circle cx="160" cy="128" r="26" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="160" cy="128" r="23" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>

  <!-- ─── TILTED TOP LAPTOP RESTING PLATFORM (Angled forward for ergonomics) ─── -->
  <polygon points="36,88 284,88 248,46 72,46" fill="url(#mstandMetal)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Platform Diagonal Metallic Sheen -->
  <polygon points="72,46 160,46 110,88 36,88" fill="rgba(255,255,255,0.3)"/>

  <!-- Silicone Protective Pads on Platform (Prevents laptop scratching) -->
  <rect x="80" y="52" width="28" height="8" rx="3" fill="#475569"/>
  <rect x="212" y="52" width="28" height="8" rx="3" fill="#475569"/>
  <rect x="140" y="62" width="40" height="6" rx="3" fill="#475569"/>

  <!-- Front Curved Holding Lip (Holds MacBook securely in place) -->
  <path d="M 36 88 L 36 94 Q 36 99 42 99 L 278 99 Q 284 99 284 94 L 284 88 Z" fill="url(#mstandMetal)" stroke="#64748b" stroke-width="1"/>
  <!-- Front Lip Silicone Cushion -->
  <rect x="80" y="93" width="40" height="4" rx="2" fill="#334155"/>
  <rect x="200" y="93" width="40" height="4" rx="2" fill="#334155"/>
</svg>
